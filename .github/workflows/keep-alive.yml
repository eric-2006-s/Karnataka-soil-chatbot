name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to reset its inactivity clock
        run: |
          curl -sSf --max-time 30 "${{ vars.STREAMLIT_APP_URL }}" -o /dev/null
          echo "Pinged ${{ vars.STREAMLIT_APP_URL }} — status OK"
